<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Email Agent API Tester</title>
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <div id="app" class="container">
            <h1>Email Agent API Tester</h1>

            <div class="user-bar">
                <select id="user-select">
                    <option value="">Loading users...</option>
                </select>
                <button id="refresh-users" class="btn btn-secondary">
                    Refresh
                </button>
                <div class="agent-status">
                    <span
                        id="agent-status-indicator"
                        class="status-indicator"
                    ></span>
                    <span id="agent-status-text">Checking agent...</span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="auth">Auth</button>
                <button class="tab-btn" data-tab="email">Email</button>
                <button class="tab-btn" data-tab="calendar">Calendar</button>
                <button class="tab-btn" data-tab="agent">Agent</button>
            </div>

            <div class="test-layout">
                <div class="test-panel">
                    <div id="auth-tab" class="tab-pane active">
                        <div class="api-section">
                            <h2 class="section-title" data-section="auth-main">
                                <span>Auth</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div class="section-content" id="auth-main-section">
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/auth/login"
                                        data-body='{"email": "{{email}}", "password": "{{password}}"}'
                                    >
                                        Login
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/auth/signup"
                                        data-body='{"username": "{{username}}", "email": "{{email}}", "password": "{{password}}"}'
                                    >
                                        Signup
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="email"
                                        placeholder="email"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="password"
                                        placeholder="password"
                                        value="password123"
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="username"
                                        placeholder="username"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>
                        <div class="api-section">
                            <h2 class="section-title" data-section="auth-users">
                                <span>Users</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="auth-users-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/auth/users/{{user_id}}"
                                    >
                                        Get User
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="PUT"
                                        data-endpoint="/api/auth/users/{{user_id}}"
                                        data-body='{"username": "{{username}}", "email": "{{email}}", "password": "{{password}}"}'
                                    >
                                        Update User
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="DELETE"
                                        data-endpoint="/api/auth/users/{{user_id}}"
                                    >
                                        Delete User
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="username"
                                        placeholder="username"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="email"
                                        placeholder="email"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="password"
                                        placeholder="new password"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="email-tab" class="tab-pane">
                        <div class="api-section">
                            <h2 class="section-title" data-section="emails-get">
                                <span>Get</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="emails-get-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/emails/inbox?user_id={{user_id}}"
                                    >
                                        Get Inbox
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/emails/sent?user_id={{user_id}}"
                                    >
                                        Get Sent
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/emails/{{email_id}}"
                                    >
                                        Get Email
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="email_id"
                                        placeholder="email_id"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="emails-send"
                            >
                                <span>Send</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="emails-send-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/emails/send"
                                        data-body='{"sender_id": {{user_id}}, "recipient_email": "{{recipient_email}}", "subject": "{{subject}}", "body": "{{body}}"}'
                                    >
                                        Send Email
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/emails/reply"
                                        data-body='{"sender_id": {{user_id}}, "parent_email_id": {{email_id}}, "body": "{{body}}"}'
                                    >
                                        Reply
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="recipient_email"
                                        placeholder="recipient_email"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="subject"
                                        placeholder="subject"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="body"
                                        placeholder="body"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="email_id"
                                        placeholder="parent_email_id"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="emails-update"
                            >
                                <span>Update</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="emails-update-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="PUT"
                                        data-endpoint="/api/emails/mark_read"
                                        data-body='{"email_id": {{email_id}}}'
                                    >
                                        Mark Read
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="email_id"
                                        placeholder="email_id"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>
                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="emails-threads"
                            >
                                <span>Threads</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="emails-threads-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/emails/threads?user_id={{user_id}}"
                                    >
                                        Get Threads
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/emails/threads/{{thread_id}}?user_id={{user_id}}"
                                    >
                                        Get Thread Emails
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="thread_id"
                                        placeholder="thread_id"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="calendar-tab" class="tab-pane">
                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="calendar-availability"
                            >
                                <span>Availability</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="calendar-availability-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/calendar/availability"
                                        data-body='{"user_id": {{user_id}}, "start_time": "{{start_time}}", "duration_minutes": {{duration_minutes}}}'
                                    >
                                        Check Availability
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="start_time"
                                        placeholder="start_time (YYYY-MM-DDTHH:MM:SS)"
                                        value="2025-05-15T14:00:00"
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="duration_minutes"
                                        placeholder="duration_minutes"
                                        value="60"
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="calendar-events"
                            >
                                <span>Events</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="calendar-events-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/calendar/events?user_id={{user_id}}&start_date={{start_date}}&end_date={{end_date}}"
                                    >
                                        Get Events
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/calendar/events/{{event_id}}"
                                    >
                                        Get Event
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/calendar/events"
                                        data-body='{"organizer_id": {{user_id}}, "title": "{{title}}", "description": "{{description}}", "start_time": "{{start_time}}", "end_time": "{{end_time}}", "attendee_ids": [], "location": "{{location}}"}'
                                    >
                                        Create Event
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="PUT"
                                        data-endpoint="/api/calendar/events/{{event_id}}"
                                        data-body='{"title": "{{title}}", "description": "{{description}}", "location": "{{location}}"}'
                                    >
                                        Update Event
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="DELETE"
                                        data-endpoint="/api/calendar/events/{{event_id}}"
                                    >
                                        Delete Event
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="event_id"
                                        placeholder="event_id"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="title"
                                        placeholder="title"
                                        value="Meeting"
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="description"
                                        placeholder="description"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="location"
                                        placeholder="location"
                                        value=""
                                    />
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="start_time"
                                        placeholder="start_time (YYYY-MM-DDTHH:MM:SS)"
                                        value="2025-05-15T14:00:00"
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="end_time"
                                        placeholder="end_time (YYYY-MM-DDTHH:MM:SS)"
                                        value="2025-05-15T15:00:00"
                                    />
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="start_date"
                                        placeholder="filter: start_date (YYYY-MM-DD)"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="end_date"
                                        placeholder="filter: end_date (YYYY-MM-DD)"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="agent-tab" class="tab-pane">
                        <div class="api-section">
                            <h2 class="section-title" data-section="agent-list">
                                <span>List</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="agent-list-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/agent/threads?user_id={{user_id}}"
                                    >
                                        Get Threads
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="agent-thread"
                            >
                                <span>Thread</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="agent-thread-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/agent/thread"
                                        data-body='{"user_id": {{user_id}}, "prompt": "{{context}}"}'
                                    >
                                        Create Thread
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/agent/draft"
                                        data-body='{"user_id": {{user_id}}, "prompt": "{{context}}", "thread_id": "{{thread_id}}"}'
                                    >
                                        Create Draft
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/agent/thread/{{thread_id}}/reply"
                                        data-body='{"user_id": {{user_id}}, "response": "{{response}}"}'
                                    >
                                        Reply to Thread
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/agent/thread/{{thread_id}}"
                                    >
                                        Get Thread
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="DELETE"
                                        data-endpoint="/api/agent/thread/{{thread_id}}"
                                    >
                                        Cancel Thread
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="thread_id"
                                        placeholder="thread_id"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="context"
                                        placeholder="prompt"
                                        value=""
                                    />
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="response"
                                        placeholder="response (y to approve or feedback)"
                                        value="y"
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="agent-status"
                            >
                                <span>Status</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="agent-status-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/agent/status/{{thread_id}}"
                                    >
                                        Get Status
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="GET"
                                        data-endpoint="/api/agent/history/{{thread_id}}"
                                    >
                                        Get History
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="thread_id"
                                        placeholder="thread_id"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="api-section">
                            <h2
                                class="section-title"
                                data-section="agent-meeting"
                            >
                                <span>Meeting</span>
                                <span class="toggle">▼</span>
                            </h2>
                            <div
                                class="section-content"
                                id="agent-meeting-section"
                            >
                                <div class="test-group">
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/agent/thread/{{thread_id}}/confirm"
                                        data-body="{}"
                                    >
                                        Confirm Meeting
                                    </button>
                                    <button
                                        class="test-btn"
                                        data-method="POST"
                                        data-endpoint="/api/agent/thread/{{thread_id}}/decline"
                                        data-body="{}"
                                    >
                                        Decline Meeting
                                    </button>
                                </div>
                                <div class="input-row">
                                    <input
                                        type="text"
                                        class="input-field"
                                        data-var="thread_id"
                                        placeholder="thread_id"
                                        value=""
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="response-column">
                    <div class="response-panel">
                        <div class="response-header">
                            <h3>Response</h3>
                            <button
                                id="clear-response"
                                class="btn btn-secondary"
                            >
                                Clear
                            </button>
                        </div>
                        <pre id="response-output"></pre>
                    </div>

                    <div class="response-panel">
                        <div class="response-header">
                            <h3>Agent Response</h3>
                            <button
                                id="clear-agent-response"
                                class="btn btn-secondary"
                            >
                                Clear
                            </button>
                        </div>
                        <pre id="agent-response-output"></pre>
                    </div>
                </div>
            </div>
        </div>

        <script src="/static/app.js"></script>
    </body>
</html>
